name: Versive
description: >-
  Versive was a Seattle-based artificial-intelligence and machine-learning
  cybersecurity company (originally founded as Context Relevant) whose flagship
  product, the Versive Security Engine (VSE), applied machine learning to network
  and security telemetry to automatically surface adversary campaigns and
  in-progress breaches for security operations teams. Backed by Bloomberg Beta
  and other investors, Versive was acquired by managed-detection-and-response
  provider eSentire in October 2018, after which its technology was folded into
  eSentire's MDR platform and the independent Versive website (versive.com) was
  retired. This profile is retained in the API Evangelist network as a portfolio
  lead; the enrichment pipeline found no live, independent Versive developer or
  API surface to harvest.
